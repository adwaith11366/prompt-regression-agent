name: Prompt Regression
on:
  pull_request:
    paths: ["prompts/**", "tests/cases.json"]
permissions:
  contents: read
  pull-requests: write
env:
  PROMPT_FILE: prompts/prompt_v1.txt   # the prompt your app actually ships
jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Get prompt from base branch
        run: git show origin/${{ github.base_ref }}:$PROMPT_FILE > /tmp/old_prompt.txt
      - name: Run regression agent
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FLAG=""; [ -z "$ANTHROPIC_API_KEY" ] && FLAG="--mock"
          set +e
          python regress.py --old /tmp/old_prompt.txt --new "$PROMPT_FILE" --repeats 3 $FLAG
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Comment scorecard on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('reports/latest.md')) return;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync('reports/latest.md', 'utf8'),
            });
      - name: Fail the check if the change is blocked
        if: steps.run.outputs.code != '0'
        run: exit 1
